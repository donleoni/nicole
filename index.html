<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Love You ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

}

body {

    display: flex;

    justify-content: center;
    align-items: center;

}

canvas {

    display: block;

    width: 100vw;
    height: 100vh;

    background: #000;

}

</style>

</head>


<body>

<canvas id="canvas"></canvas>


<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/* =====================================================
   CONFIGURAÇÕES
===================================================== */

const WORDS = [

    "love you",
    "Love You",
    "LOVE YOU"

];


const COLORS = [

    "#4682B4",
    "#1E90FF",
    "#00BFFF",
    "#6495ED",
    "#4169E1"

];


const CENTER_TEXT = "Love You";

const PERSON_NAME = "Nicole";


let particles = [];

let frame = 0;


/* =====================================================
   TAMANHO DA TELA
===================================================== */

let width;
let height;
let scale;


function resize() {

    const dpr =
        window.devicePixelRatio || 1;


    width =
        window.innerWidth;


    height =
        window.innerHeight;


    canvas.width =
        width * dpr;


    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";


    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    /*
       O coração se adapta à tela.
    */

    scale =
        Math.min(
            width,
            height
        ) / 36;

}


window.addEventListener(
    "resize",
    resize
);


resize();


/* =====================================================
   CORAÇÃO
===================================================== */

function heartXY(t) {

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );


    const y =

        13 * Math.cos(t)

        - 5 *
        Math.cos(2 * t)

        - 2 *
        Math.cos(3 * t)

        - Math.cos(4 * t);


    return {
        x: x,
        y: -y
    };

}


/* =====================================================
   CONVERTER PARA TELA
===================================================== */

function toScreen(x, y) {

    return {

        x:
            x * scale
            + width / 2,

        y:
            y * scale
            + height / 2

    };

}


/* =====================================================
   PARTÍCULA
===================================================== */

class Particle {

    constructor(
        x,
        y,
        delay,
        kind
    ) {

        this.x = x;
        this.y = y;

        this.delay = delay;

        this.kind = kind;

        this.word =
            WORDS[
                Math.floor(
                    Math.random()
                    * WORDS.length
                )
            ];


        this.color =
            COLORS[
                Math.floor(
                    Math.random()
                    * COLORS.length
                )
            ];


        this.alpha = 0;


        this.flicker =
            Math.random()
            * Math.PI
            * 2;


        this.size =
            kind === "outline"

            ? random(
                10,
                15
            )

            : random(
                8,
                13
            );

    }

}


/* =====================================================
   RANDOM
===================================================== */

function random(min, max) {

    return (
        Math.random()
        * (max - min)
        + min
    );

}


/* =====================================================
   CRIAR CONTORNO
===================================================== */

function createOutline() {

    const total = 150;


    for (
        let i = 0;
        i < total;
        i++
    ) {

        const t =
            (i / total)
            * Math.PI
            * 2;


        const point =
            heartXY(t);


        const screen =
            toScreen(
                point.x,
                point.y
            );


        particles.push(

            new Particle(

                screen.x,
                screen.y,

                i * 2,

                "outline"

            )

        );

    }

}


/* =====================================================
   CRIAR PREENCHIMENTO
===================================================== */

function createFill() {

    const total = 130;


    for (
        let i = 0;
        i < total;
        i++
    ) {

        const t =
            random(
                0,
                Math.PI * 2
            );


        const r =
            random(
                0.15,
                0.85
            );


        const point =
            heartXY(t);


        const x =
            point.x * r;


        const y =
            point.y * r;


        const screen =
            toScreen(
                x,
                y
            );


        particles.push(

            new Particle(

                screen.x,
                screen.y,

                320 + i * 2,

                "fill"

            )

        );

    }

}


/* =====================================================
   CRIAR PARTÍCULAS
===================================================== */

createOutline();

createFill();


/* =====================================================
   DESENHAR PARTÍCULA
===================================================== */

function drawParticle(
    particle
) {

    if (
        frame <
        particle.delay
    ) {

        return;

    }


    if (
        particle.alpha <
        255
    ) {

        particle.alpha += 14;

        if (
            particle.alpha >
            255
        ) {

            particle.alpha =
                255;

        }

    }


    const flicker =

        0.75
        + 0.25 *

        Math.sin(

            frame * 0.04
            + particle.flicker

        );


    const brightness =

        particle.alpha
        * flicker;


    if (
        brightness <= 0
    ) {

        return;

    }


    ctx.save();


    /*
       Brilho externo
    */

    ctx.shadowBlur =
        particle.size * 2.5;


    ctx.shadowColor =
        particle.color;


    ctx.globalAlpha =
        brightness / 255;


    ctx.fillStyle =
        particle.color;


    ctx.font =
        `bold ${particle.size}px Arial`;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(

        particle.word,

        particle.x,
        particle.y

    );


    ctx.restore();

}


/* =====================================================
   TEXTO CENTRAL
===================================================== */

function drawCenterText() {

    const centerStart =
        600;


    if (
        frame <=
        centerStart
    ) {

        return;

    }


    const progress =

        Math.min(

            1,

            (
                frame
                - centerStart
            ) / 60

        );


    const pulse =

        1
        + 0.025 *

        Math.sin(
            frame * 0.05
        );


    const fontSize =

        Math.min(
            52 * pulse,
            width * 0.09
        );


    const nameSize =

        Math.min(
            28 * pulse,
            width * 0.05
        );


    const alpha =

        1 -
        Math.exp(
            -progress * 8
        );


    ctx.save();


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    /*
       ===============================================
       GLOW DO LOVE YOU
       ===============================================
    */

    ctx.shadowBlur =
        35;


    ctx.shadowColor =
        "#1E90FF";


    ctx.globalAlpha =
        alpha;


    ctx.fillStyle =
        "#4169E1";


    ctx.font =
        `bold ${fontSize + 10}px Georgia`;


    ctx.fillText(

        CENTER_TEXT,

        width / 2,

        height / 2

    );


    /*
       ===============================================
       LOVE YOU PRINCIPAL
       ===============================================
    */

    ctx.shadowBlur =
        12;


    ctx.shadowColor =
        "#FFFFFF";


    ctx.fillStyle =
        "#FFF5EE";


    ctx.font =
        `bold ${fontSize}px Georgia`;


    ctx.fillText(

        CENTER_TEXT,

        width / 2,

        height / 2

    );


    /*
       ===============================================
       GLOW DO NOME
       ===============================================
    */

    ctx.shadowBlur =
        25;


    ctx.shadowColor =
        "#00BFFF";


    ctx.fillStyle =
        "#4169E1";


    ctx.font =
        `${nameSize + 7}px Georgia`;


    ctx.fillText(

        PERSON_NAME,

        width / 2,

        height / 2 + fontSize * 1.25

    );


    /*
       ===============================================
       NOME EMILY
       ===============================================
    */

    ctx.shadowBlur =
        8;


    ctx.shadowColor =
        "#00BFFF";


    ctx.fillStyle =
        "#BFE7FF";


    ctx.font =
        `${nameSize}px Georgia`;


    ctx.fillText(

        PERSON_NAME,

        width / 2,

        height / 2 + fontSize * 1.25

    );


    ctx.restore();

}


/* =====================================================
   ANIMAÇÃO
===================================================== */

function animate() {

    frame++;


    /*
       Fundo
    */

    ctx.fillStyle =
        "#000000";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
       Partículas
    */

    for (
        const particle
        of particles
    ) {

        drawParticle(
            particle
        );

    }


    /*
       Texto
    */

    drawCenterText();


    requestAnimationFrame(
        animate
    );

}


/* =====================================================
   INICIAR
===================================================== */

animate();

</script>

</body>

</html>
